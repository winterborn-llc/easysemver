name: EasySemVer
description: >-
  Version a folder from what happened to its public API surface, expose the verdict as step
  outputs, and - if you ask it to - commit and tag the bump.
author: Winterborn LLC

branding:
  icon: tag
  color: blue

inputs:
  folder:
    description: >-
      The folder root to version. Relative paths resolve against the workspace, so the
      default runs against the repository you checked out.
    required: false
    default: '.'

  dry-run:
    description: >-
      'true' to classify and report the verdict without writing anything: no baseline, no
      version stamped (CLI-07). Every non-dry run is a release and bumps by at least a patch,
      so gate this action accordingly (INV-03).
    required: false
    default: 'false'

  commit:
    description: >-
      'true' to stage exactly the files the run wrote (REP-10), commit them, and push to the
      branch that triggered the workflow. Defaults to 'false': pushing a version bump to
      someone's repository is the caller's decision, and this input is where the caller makes
      it (ACT-06). Requires `permissions: contents: write`.
    required: false
    default: 'false'

  tag:
    description: >-
      'true' to also create and push 'v<version>'. Requires commit: true - the tag names a
      commit, and tagging one this action did not make is not something it can do correctly.
      The two are pushed atomically, so a tag can never survive a rejected branch push and
      point at a commit that never landed.
    required: false
    default: 'false'

  max-minor:
    description: >-
      Cap the minor segment: once it passes this, it resets to zero and major is raised by one
      (CLI-11). Empty by default, meaning no ceiling. Set this only when the target cannot hold
      an arbitrary integer per segment - a carried segment reports a Minor bump on a run where
      nothing was added, so the number stops meaning what it says everywhere else.
    required: false
    default: ''

  max-patch:
    description: >-
      Cap the patch segment, carrying into minor. Empty by default. The case that needs it is a
      framework or dylib target in an .xcodeproj: DYLIB_CURRENT_VERSION derives from
      CURRENT_PROJECT_VERSION, which this tool writes, and caps the lower two segments at 255,
      so set both to 255 there. App targets and SwiftPM packages have no such limit.
    required: false
    default: ''

  do-not-exclude:
    description: >-
      Directory names discovery would otherwise skip (FLD-04) but this project versions anyway,
      one per line. A bare name, never a path - the exclusion matches a single path segment.
      Use it when your own code lives somewhere the default list names, e.g. a repository that
      keeps first-party modules under 'build'. The run logs every directory it skipped, which is
      how you find out you need this.
    required: false
    default: ''

  vnext-token-name:
    description: >-
      The name inside the braces of the text token the run stamps with the new version, in files
      of any kind under the folder (TOK-01). It defaults to the tool's own default, which is
      'vnext' - so a heading written as a double-braced vnext becomes the version this run
      published. Pass the name only, never the braces. Set it when that literal legitimately
      means something else in your repository; a name you never write turns the replacement off
      as a side effect, which is how a repository documenting this feature keeps its own docs.
    required: false
    default: ''

  report:
    description: >-
      Act on a report an earlier step produced instead of versioning again. Pass this the `report`
      output of a previous invocation of this action, and it commits that verdict: versioning and
      committing are split, a build and its tests run in between, and a failure releases nothing.
      With it set the tool is neither downloaded nor run, so the version is computed exactly once
      however many times this action appears in a job. See the README for the worked example -
      it cannot be shown here, because GitHub evaluates expressions inside these descriptions and
      the `steps` context does not exist at this point in the manifest (ACT-13).
    required: false
    default: ''

  version:
    description: >-
      The EasySemVer release tag to run. Always an exact release, never 'latest', so that a
      workflow pinned to a tag of this action cannot change behaviour under its author. The
      release pipeline rewrites the default below to the release it is cutting, which is what
      lets the moving 'v<major>' tag carry a manifest and a binary from the same release.
    required: false
    default: v21.1.0

  token:
    description: >-
      Token used to download the release archive. The default only suffices while
      winterborn-llc/easysemver is public; against a private repository a caller must supply
      a token that can read its releases.
    required: false
    default: ${{ github.token }}

# ACT-06. The action never commits, tags or pushes unless a caller asks it to, because pushing
# a version bump to someone's repository is not a decision a version calculator gets to make.
# `commit:` and `tag:` are where that decision is made - and once it has been, making the caller
# hand-write the mechanics of it buys nobody anything. Both default to false, so this is opt-in
# and no existing workflow changes behaviour.
#
# Publishing is still not here. There is no one way to publish, so there is nothing to encode.
outputs:
  version:
    description: The new version, e.g. '2.4.0'. On a dry run, the version that would be written.
    value: ${{ steps.run.outputs.version }}

  old-version:
    description: The version the run started from, e.g. '2.3.4'.
    value: ${{ steps.run.outputs.old-version }}

  change-type:
    description: >-
      'major', 'minor' or 'patch'. The classification itself - do not re-derive it by
      comparing the two versions, which is wrong across an overflow rollover (REP-06).
    value: ${{ steps.run.outputs.change-type }}

  dry-run:
    description: >-
      'true' if this run wrote nothing. Read from the report rather than echoed from the
      input, so it describes what happened rather than what was asked for.
    value: ${{ steps.run.outputs.dry-run }}

  major:
    description: First segment of the new version, as a number. For a '3' / '3.0' / '3.0.0' tag set.
    value: ${{ steps.run.outputs.major }}

  minor:
    description: Second segment of the new version, as a number.
    value: ${{ steps.run.outputs.minor }}

  patch:
    description: Third segment of the new version, as a number.
    value: ${{ steps.run.outputs.patch }}

  report:
    description: >-
      Path to the raw JSON report. Here so that a field added under REP-04 is readable
      without this action having to grow an output for it first.
    value: ${{ steps.run.outputs.report }}

# INV-05. A composite action rather than Docker or JS: the deliverable is already a
# self-contained native binary (PKG-02), so there is nothing for a container to add except a
# pull, and nothing for a JS wrapper to add except a second language and a `dist/` bundle to
# keep in sync. Composite also runs on every runner OS, which a Docker action does not.
runs:
  using: composite

  steps:
    # ------------------------------------------------------------------------------------
    # Fetch the pinned release binary (PKG-02). `gh` is present on every GitHub-hosted
    # runner and works whether the release is public or private, which plain curl does not.
    #
    # Skipped entirely when `report:` names an earlier verdict: that invocation commits what
    # has already been computed, so there is nothing to download and nothing to run. This is
    # what makes the two-step form cost one download per job rather than two, and - far more
    # importantly - what makes it impossible to bump the version twice in one job.
    # ------------------------------------------------------------------------------------
    - name: Install EasySemVer
      if: inputs.report == ''
      shell: bash
      env:
        # Inputs are passed through the environment, never interpolated into the script.
        # `${{ inputs.x }}` inside a run block is substituted before bash ever sees it, so a
        # caller passing a folder named `; rm -rf /` would be running it, not naming it.
        EASYSEMVER_VERSION: ${{ inputs.version }}
        GH_TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail

        case "$RUNNER_OS/$RUNNER_ARCH" in
          Linux/X64)     rid=linux-x64   ; archive=tar.gz ; exe=      ;;
          Linux/ARM64)   rid=linux-arm64 ; archive=tar.gz ; exe=      ;;
          macOS/X64)     rid=osx-x64     ; archive=tar.gz ; exe=      ;;
          macOS/ARM64)   rid=osx-arm64   ; archive=tar.gz ; exe=      ;;
          Windows/X64)   rid=win-x64     ; archive=zip    ; exe=.exe  ;;
          *)
            # Named rather than guessed: silently falling back to x64 would produce a
            # confusing exec-format error several steps later.
            echo "::error::EasySemVer publishes no binary for $RUNNER_OS/$RUNNER_ARCH. Supported: linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64." >&2
            exit 1
            ;;
        esac

        dir="$RUNNER_TEMP/easysemver"
        mkdir -p "$dir"
        asset="easysemver-$rid.$archive"

        echo "Downloading $asset from EasySemVer $EASYSEMVER_VERSION"
        gh release download "$EASYSEMVER_VERSION" \
          --repo winterborn-llc/easysemver \
          --pattern "$asset" \
          --dir "$dir" \
          --clobber

        if [ "$RUNNER_OS" = "Windows" ]; then
          powershell -NoProfile -NonInteractive -Command \
            "Expand-Archive -Path '$dir/$asset' -DestinationPath '$dir' -Force"
        else
          tar -xzf "$dir/$asset" -C "$dir"
        fi

        # The publish output is named for the assembly, not for the `dotnet tool` command:
        # `easysemver` only exists where PackAsTool created it. Rename once here so the rest
        # of the action, and anything reading the log, sees the name the tool is known by.
        #
        # This name must track EasySemVer.csproj's AssemblyName. ActionRegression asserts that
        # it does, because when the two drifted apart the failure landed here - in a download
        # that unpacked fine and then had nothing to run.
        mv "$dir/Winterborn.Tools.EasySemVer$exe" "$dir/easysemver$exe"
        chmod +x "$dir/easysemver$exe"
        echo "$dir" >> "$GITHUB_PATH"

    # ------------------------------------------------------------------------------------
    # Run it. The tool publishes its own outputs and job summary (CLI-10) - this action does
    # not read the report, and neither does a calling workflow. There used to be a `jq`
    # block here doing that mapping, and a second copy of it in every workflow that used the
    # CLI directly; both are gone.
    # ------------------------------------------------------------------------------------
    - name: Run EasySemVer
      id: run
      if: inputs.report == ''
      shell: bash
      env:
        EASYSEMVER_FOLDER: ${{ inputs.folder }}
        EASYSEMVER_DRY_RUN: ${{ inputs.dry-run }}
        EASYSEMVER_MAX_MINOR: ${{ inputs.max-minor }}
        EASYSEMVER_MAX_PATCH: ${{ inputs.max-patch }}
        EASYSEMVER_DO_NOT_EXCLUDE: ${{ inputs.do-not-exclude }}
        EASYSEMVER_VNEXT_TOKEN_NAME: ${{ inputs.vnext-token-name }}
      run: |
        set -euo pipefail

        report="$RUNNER_TEMP/easysemver/report.json"

        # An unrecognised value is rejected rather than treated as false: a typo'd
        # `dry-run: yes` that silently stamped versions and rewrote the baseline would be a
        # bad way to find out about the typo.
        case "$EASYSEMVER_DRY_RUN" in
          true)  dry_run=--dry-run ;;
          false) dry_run= ;;
          *)
            echo "::error::dry-run must be 'true' or 'false', got '$EASYSEMVER_DRY_RUN'." >&2
            exit 1
            ;;
        esac

        # CLI-11's ceilings. Empty means no ceiling and contributes no argument, which is what
        # keeps every workflow that has not asked for this byte-identical. Anything that is not
        # a run of digits is rejected on the same reasoning as dry-run above: `max-patch: '255 '`
        # or a templated empty expression should say so, not silently version differently for
        # months. That check also leaves the value safe to expand unquoted below, because by
        # then it provably holds nothing but digits.
        caps=
        case "$EASYSEMVER_MAX_MINOR" in
          '') ;;
          *[!0-9]*)
            echo "::error::max-minor must be a whole number of zero or more, got '$EASYSEMVER_MAX_MINOR'." >&2
            exit 1
            ;;
          *) caps="--max-minor $EASYSEMVER_MAX_MINOR" ;;
        esac

        case "$EASYSEMVER_MAX_PATCH" in
          '') ;;
          *[!0-9]*)
            echo "::error::max-patch must be a whole number of zero or more, got '$EASYSEMVER_MAX_PATCH'." >&2
            exit 1
            ;;
          *) caps="$caps --max-patch $EASYSEMVER_MAX_PATCH" ;;
        esac

        # CLI-12's kept directory names, one per line so that a name containing a space is still
        # nameable - which is also why these go into an array and are expanded quoted, unlike the
        # two above. `${keep[@]+...}` is the expansion that survives an empty array under `set -u`
        # on bash 3.2, still what a macOS runner's /bin/bash is.
        keep=()
        while IFS= read -r name; do
          name="${name%$'\r'}"
          [ -z "$name" ] && continue
          case "$name" in
            */*|*\\*)
              echo "::error::do-not-exclude takes directory names, not paths, and got '$name'." >&2
              exit 1
              ;;
          esac
          keep+=(--do-not-exclude "$name")
        done <<< "$EASYSEMVER_DO_NOT_EXCLUDE"

        # CLI-13's token name. Empty contributes no argument, so the tool's own default stays the
        # one place the default token is written down and a workflow that has not asked for this
        # is unaffected. Unlike the ceilings above there is no validation here: the value is
        # expanded quoted out of an array, so nothing a caller supplies can be anything but one
        # argument, and the tool already rejects a name carrying braces or whitespace by name.
        token=()
        if [ -n "$EASYSEMVER_VNEXT_TOKEN_NAME" ]; then
          token=(--vnext-token-name "$EASYSEMVER_VNEXT_TOKEN_NAME")
        fi

        # Exit 1 fails this step and stops the action, which is the whole point of CLI-06:
        # a versioning failure on a release build should be impossible to miss. REP-08 and
        # ACT-07 then leave nothing behind - no report, and no outputs - so a later step
        # cannot read a half-truth off a run that died.
        #
        # `--github` (CLI-10) is what publishes this action's outputs and the job summary,
        # passed explicitly rather than left to the GITHUB_ACTIONS auto-detection: inside a
        # composite action the tool is a step of someone else's workflow, and the outputs
        # this action promises its callers should not hinge on an environment variable being
        # what we expect.
        #
        # $dry_run and $caps are deliberately unquoted, so that empty expands to no argument at
        # all rather than to an empty one. $dry_run holds a literal set just above; $caps holds
        # only flag names and values the case blocks have proven to be digits. Neither can carry
        # anything else a caller supplied, which is what makes that safe. The array form this
        # replaces tripped `set -u` on bash 3.2 - still what a macOS runner's /bin/bash is.
        #
        # shellcheck disable=SC2086
        easysemver "$EASYSEMVER_FOLDER" $dry_run $caps ${keep[@]+"${keep[@]}"} ${token[@]+"${token[@]}"} --github --json "$report"

    # ------------------------------------------------------------------------------------
    # ACT-11. Commit and tag, if the caller asked for it. Opt-in, and a no-op otherwise -
    # this whole step is what `commit: true` replaces, and there is no reason for every
    # consumer to keep a copy of it.
    #
    # The only step that runs in both forms: with the verdict from the run step above, or
    # (ACT-12) with one an earlier invocation produced, when a build and its tests have to
    # happen in between. It reads everything from the report either way, so the two cannot
    # drift into committing a version different from the one that was stamped.
    #
    # It runs unconditionally and gates itself in bash rather than carrying a step-level
    # `if:`, so that ActionRegression - which extracts and executes these `run:` bodies -
    # exercises the gate too. A gate that only exists in yaml is a gate no test can reach.
    # ------------------------------------------------------------------------------------
    - name: Commit and tag
      shell: bash
      env:
        EASYSEMVER_COMMIT: ${{ inputs.commit }}
        EASYSEMVER_TAG: ${{ inputs.tag }}

        # Either the caller's report, or the one the run step above just wrote. Everything this
        # step needs comes out of that file rather than from the inputs, so it describes what
        # happened and behaves identically whichever of the two forms produced it.
        EASYSEMVER_REPORT: ${{ inputs.report }}
        EASYSEMVER_RUN_REPORT: ${{ steps.run.outputs.report }}
      run: |
        set -euo pipefail

        # ACT-04's rule, applied to these two as well: anything but true/false is rejected.
        # A typo'd `commit: yes` that silently released nothing would be found days later, by
        # someone wondering why the version on nuget.org has no commit behind it.
        case "$EASYSEMVER_COMMIT" in
          true|false) ;;
          *) echo "::error::commit must be 'true' or 'false', got '$EASYSEMVER_COMMIT'." >&2; exit 1 ;;
        esac

        case "$EASYSEMVER_TAG" in
          true|false) ;;
          *) echo "::error::tag must be 'true' or 'false', got '$EASYSEMVER_TAG'." >&2; exit 1 ;;
        esac

        if [ "$EASYSEMVER_TAG" = "true" ] && [ "$EASYSEMVER_COMMIT" != "true" ]; then
          echo "::error::tag: true requires commit: true - a tag names a commit, and this action will not tag one it did not make." >&2
          exit 1
        fi

        if [ "$EASYSEMVER_COMMIT" != "true" ]; then
          exit 0
        fi

        report="${EASYSEMVER_REPORT:-$EASYSEMVER_RUN_REPORT}"
        if [ ! -f "$report" ]; then
          echo "::error::No report to commit. Pass report: with the 'report' output of an earlier EasySemVer step, or drop it to version in this step." >&2
          exit 1
        fi

        # The verdict is read from the report, never from the inputs, so the two-step form cannot
        # commit a version different from the one that was stamped.
        version=$(jq -r .newVersion.version "$report")

        # A dry run wrote nothing (CLI-07), so there is nothing to commit. Asking for both is a
        # contradiction, and silently doing nothing is the failure mode ACT-04 exists to avoid.
        if [ "$(jq -r .dryRun "$report")" = "true" ]; then
          echo "::error::commit: true cannot be combined with dry-run: true - a dry run writes nothing to commit." >&2
          exit 1
        fi

        # Only if the caller has not set one. A workflow that configured its own identity - a
        # signing bot, say - keeps it, and does not need an input here to say so.
        git config user.name  >/dev/null 2>&1 || git config user.name  "github-actions[bot]"
        git config user.email >/dev/null 2>&1 || \
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

        # REP-10: exactly what the run wrote, and nothing else. A hand-written path list goes
        # stale silently, and `git add -u` would sweep in whatever else the job has touched -
        # test debris, build output - and put it in a release commit.
        jq -r '.writtenFiles[]' "$report" | git add --pathspec-from-file=-
        git commit -m "EasySemVer: $version"

        # `HEAD:` because actions/checkout leaves a detached HEAD at the triggering commit.
        refs=("HEAD:$GITHUB_REF_NAME")
        if [ "$EASYSEMVER_TAG" = "true" ]; then
          git tag "v$version"
          refs+=("v$version")
        fi

        # --atomic: both refs land or neither does. Without it a rejected branch push can still
        # leave the tag behind, pointing at a commit that never reached the remote.
        #
        # The array always holds at least the branch, so expanding it cannot trip `set -u` on
        # bash 3.2 the way an empty one did once before.
        git push --atomic origin "${refs[@]}"
