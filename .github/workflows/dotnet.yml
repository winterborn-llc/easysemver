name: .NET

on:
  push:
    branches: [ "main" ]
env:
  configuration: Release
  project: AutoVersion

jobs:
  build:

    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        dotnet-version: [ '8.0.x', '9.0.x', '10.0.x' ]


    steps:
    - uses: actions/checkout@v3
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v2
      with:
        dotnet-version: ${{ matrix.dotnet-version }}
        
    - name: Restore dependencies
      working-directory: ./src
      run: dotnet restore
      
    - name: Build
      working-directory: ./src
      run: dotnet build --no-restore --configuration ${{ env.configuration }}
      
    - name: Test
      working-directory: ./src
      run: dotnet test --no-build --verbosity normal --configuration ${{ env.configuration }}
      
    - name: Publish the package to nuget.org
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}
      run: dotnet nuget push ./src/${{ env.project }}/bin/${{ env.configuration }}/*.nupkg -k ${{ env.NUGET_AUTH_TOKEN }} -s https://api.nuget.org/v3/index.json --skip-duplicate
