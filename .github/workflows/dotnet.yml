name: .NET

# Only branch pushes. There is deliberately no `tags:` trigger any more: this workflow now
# creates its own tag, and a tag pushed by a workflow would either do nothing (GITHUB_TOKEN
# pushes raise no events) or, from a human, re-run the whole versioning pipeline and bump the
# version a second time for the same source.
on:
  push:
    branches: [ "main" ]

# One release at a time. Two pushes landing together would otherwise both seed from the same
# version, compute the same next one, and race to push it. `cancel-in-progress: false` because
# a half-finished release - package pushed, commit not - is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  configuration: Release
  project: EasySemVer

jobs:
  # The same reusable job ci.yml runs on every other branch, so main is not held to a different
  # standard than the branches that merge into it. It is separated from the release below so that
  # nothing is committed, tagged or pushed until the whole suite has passed on this commit.
  test:
    uses: ./.github/workflows/build-and-test.yml

  build:
    # This job only versions, builds the tool, commits, tags and publishes. `needs: test` is what
    # preserves the invariant that used to come from step order in a single job - nothing is
    # committed, tagged or pushed until the whole suite has passed on this commit.
    needs: test
    runs-on: ubuntu-latest

    # `id-token: write` lets nuget.org verify this workflow over OIDC (see the publish step);
    # `contents: write` is for pushing the version commit and the tag. Naming any permission
    # replaces the defaults wholesale, so both have to be stated.
    permissions:
      id-token: write
      contents: write

    # The version this run computed, for the release jobs below. They cannot read it from
    # `github.ref_name` any more, because nothing tag-shaped triggered them. `major` is published
    # by the action in its own right (ACT-05), so the major-tag job below never has to take a
    # substring of a version string and hope.
    outputs:
      version: ${{ steps.version.outputs.version }}
      major: ${{ steps.version.outputs.major }}

    steps:
    # Full history and tags: EasySemVer seeds from the highest version it can find, and git tags
    # are one of the places it looks. A shallow clone hides them and would seed too low.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # ------------------------------------------------------------------------------------------
    # ACT-10. This step and the release step below are the block the README documents, byte for
    # byte, and ActionRegression asserts that they stay so. Between them they replaced an install
    # step, a jq-and-$GITHUB_OUTPUT step, a commit step and a tag step: about thirty lines of
    # shell, every one of which could be subtly wrong on a release and nowhere else.
    #
    # ACT-13. `uses: ./` - the manifest from this commit, not from a published tag. The binary it
    # downloads is still the published one (`version:` defaults to the pinned release), so the
    # dogfooding rule below is untouched; what changes is that the action.yml about to be released
    # is loaded by the run that releases it.
    #
    # That is not a preference. v16.0.0 shipped an action.yml carrying `${{ steps... }}` inside an
    # input *description*, which GitHub evaluates - the manifest failed to load, the release was
    # unusable by anyone, and the next run could not even start because it pinned to it. Pinning a
    # tag here means the first workflow to prove a manifest is the first one that cannot recover
    # from it being wrong.
    #
    # Dogfooding: the Action downloads a *published* binary, deliberately rather than the one this
    # run builds - if a change breaks versioning, it breaks the next release rather than silently
    # mis-versioning the one that introduced it.
    #
    # ACT-12 is why this is two steps and not one. The version has to be stamped before the build
    # so the nupkg carries it, and nothing may be committed until that build has succeeded - a
    # single step would force one of those to give. Nothing is committed yet: if the build fails,
    # the run dies and the working copy goes with the runner.
    # ------------------------------------------------------------------------------------------
    - name: Compute and apply the version
      id: version
      uses: ./

    # ------------------------------------------------------------------------------------------
    # CI-05. The manifest about to be tagged is repointed at the release this run is cutting, and
    # the README's `uses:` refs at the major tag that will name it. Both were hand-edited until
    # now, and both were routinely wrong: `action.yml` still pinned v16.1.1 on the day v16.1.2 was
    # the newest release.
    #
    # That staleness was survivable only while every consumer copied an exact tag, because the
    # manifest and the binary it pins were released together. It stops being survivable the moment
    # `v<major>` starts moving: a floating tag whose manifest still pins an old binary hands out the
    # newest wrapper around the oldest tool, and drifts one release further every time.
    #
    # Before the build, so the README inside the nupkg (PKG-08) is the one this release ships.
    #
    # `git add` rather than a commit of its own: the release step below stages what the run wrote
    # (REP-10) and then commits *everything staged*, so these two ride along into the release
    # commit and are inside the tag. ActionRegression pins that behaviour, because it is the whole
    # mechanism here and nothing in the action's own contract says so.
    # ------------------------------------------------------------------------------------------
    - name: Repoint the manifest and the README at this release
      env:
        version: ${{ steps.version.outputs.version }}
        major: ${{ steps.version.outputs.major }}
      run: |
        # The ref's character class is spelled out rather than "everything up to the next space",
        # so a ref written mid-sentence does not swallow the backtick or full stop after it.
        sed -i "s|^    default: v.*|    default: v${version}|" action.yml
        sed -i "s|winterborn-llc/easysemver@v[A-Za-z0-9._-]*|winterborn-llc/easysemver@v${major}|g" README.md

        # Asserted, not assumed. A rename or a reformat that stopped either pattern matching would
        # ship a stale pin in silence, which is the exact failure this step exists to end.
        if ! grep -qx "    default: v${version}" action.yml; then
          echo "::error::action.yml's version pin was not rewritten to v${version} - check the sed pattern in this step against the file." >&2
          exit 1
        fi

        if grep -o 'winterborn-llc/easysemver@[A-Za-z0-9._-]*' README.md | grep -qv "@v${major}$"; then
          echo "::error::README.md still carries a uses: ref that is not @v${major}." >&2
          exit 1
        fi

        git add action.yml README.md

    # Just the tool, not the whole solution: the test projects were built and run by the `test`
    # job, and this job exists to produce one nupkg. GeneratePackageOnBuild puts it in bin, so
    # there is no separate pack step, and the implicit restore makes this one step rather than two.
    - name: Build the package
      run: dotnet build src/${{ env.project }}/${{ env.project }}.csproj --configuration ${{ env.configuration }}

    # CI-03. Git before nuget.org, because a package cannot be unpublished. If someone pushed to
    # main while this ran, this push is rejected and the run fails having published nothing -
    # rather than leaving a version on nuget.org that no commit accounts for. The Action pushes the
    # branch and the tag atomically, so the tag cannot outlive a rejected branch push and end up
    # naming a commit the remote never received.
    #
    # A GITHUB_TOKEN push raises no events, so neither ref can trigger another run of this
    # workflow. That is also why the tag has to be consumed by the jobs below rather than trigger
    # them.
    - name: Commit and tag the release
      uses: ./
      with:
        commit: true
        tag: true
        report: ${{ steps.version.outputs.report }}

    # PKG-01: a dotnet tool package, for anyone who already has a .NET SDK.
    #
    # Trusted publishing rather than a stored API key: nuget.org trades this job's OIDC token
    # for a short-lived one. The NUGET_TOKEN secret this replaces had quietly expired, and the
    # only symptom was a 403 on the very last step of an otherwise green build - a failure mode
    # that returns every time a key ages out. There is now nothing to rotate.
    #
    # `user` is a nuget.org profile name, not a credential, and must match the owner of the
    # trusted-publishing policy registered for this repository and workflow file.
    #
    # The key is good for an hour, so it is fetched immediately before the push, not earlier.
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: andrew-of-the-winterborn

    - name: Publish the package to nuget.org
      run: dotnet nuget push ./src/${{ env.project }}/bin/${{ env.configuration }}/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # `gh release upload` needs a Release to exist, and a tag alone is not one. This is its own job
  # rather than a step in the matrix below, so that five parallel jobs cannot race to create the
  # same release, and it is idempotent so that re-running the workflow - which is what you do
  # when one of the five publishes fails - does not fall over on the second attempt.
  #
  # It is created as a *draft*. Publishing a release freezes it - "Cannot upload assets to an
  # immutable release", HTTP 422 - so every asset has to be attached before that happens. The
  # draft is filled by the matrix below and published by the job after it.
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Create the release for ${{ env.tag }}
      run: >
        gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
        gh release create "${tag}" --repo "${GITHUB_REPOSITORY}"
        --draft --generate-notes --verify-tag

  # PKG-02: self-contained binaries, so a repository with no .NET in it - a Swift-only one, say -
  # can still be versioned. Runtime packs are downloadable for every target, so one Linux runner
  # cross-publishes all of them.
  release:
    needs: [ build, create-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    strategy:
      matrix:
        runtime: [ linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64 ]

    steps:
    # The tag, not the triggering commit. `actions/checkout` defaults to the SHA that started the
    # run, which predates the version bump - these binaries would report the previous version.
    - uses: actions/checkout@v5
      with:
        ref: ${{ env.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish ${{ matrix.runtime }}
      run: >
        dotnet publish src/EasySemVer/EasySemVer.csproj
        --configuration ${{ env.configuration }}
        --framework net10.0
        --runtime ${{ matrix.runtime }}
        --self-contained true
        --output publish/${{ matrix.runtime }}

    - name: Archive
      run: |
        cd publish/${{ matrix.runtime }}
        if [ "${{ matrix.runtime }}" = "win-x64" ]; then
          zip -qr ../../easysemver-${{ matrix.runtime }}.zip .
        else
          tar -czf ../../easysemver-${{ matrix.runtime }}.tar.gz .
        fi

    - name: Attach to the release
      run: gh release upload "${tag}" easysemver-${{ matrix.runtime }}.* --clobber

  # Publishing is what makes the release immutable, so it happens last, once all five archives
  # are attached. Until this runs the release is a draft and invisible to anyone but the repo's
  # own maintainers - which is the correct state for a release with no binaries on it yet.
  publish-release:
    needs: [ build, release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
    - name: Publish the release for ${{ env.tag }}
      run: gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false

  # CI-05. `v<major>` follows the newest release of that major, so a consumer can write
  # `uses: winterborn-llc/easysemver@v17` and keep getting the current 17.x without editing their
  # workflow - the same convention `actions/checkout@v5` and every other well-known action uses.
  # GitHub resolves a `uses:` ref literally and does no version matching of its own, so a moving
  # tag is the only mechanism there is.
  #
  # Last, and only once publish-release has run: this ref is what `@v<major>` resolves to for everyone,
  # so it must never name a release that is still a draft or still missing four of its five
  # archives. When a release does not complete, the right behaviour is the one that happens by
  # itself - the tag stays where it was and consumers stay on the last release that did.
  #
  # Deliberately not folded into the `tag: true` above. That tag is half of CI-03's atomic push,
  # where a force-moved ref has no business being, and it has to be pushed long before the
  # binaries exist.
  major-tag:
    needs: [ build, publish-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      major: v${{ needs.build.outputs.major }}

    steps:
    # The release tag rather than the triggering commit, so the major tag names exactly the commit
    # the release was cut from - the one carrying the version bump and the repointed manifest.
    - uses: actions/checkout@v5
      with:
        ref: v${{ needs.build.outputs.version }}

    - name: Move ${{ env.major }} to v${{ needs.build.outputs.version }}
      run: |
        git tag --force "${major}"
        git push --force origin "${major}"
