name: .NET

# Only branch pushes. There is deliberately no `tags:` trigger any more: this workflow now
# creates its own tag, and a tag pushed by a workflow would either do nothing (GITHUB_TOKEN
# pushes raise no events) or, from a human, re-run the whole versioning pipeline and bump the
# version a second time for the same source.
on:
  push:
    branches: [ "main" ]

# One release at a time. Two pushes landing together would otherwise both seed from the same
# version, compute the same next one, and race to push it. `cancel-in-progress: false` because
# a half-finished release - package pushed, commit not - is worse than a queued one.
concurrency:
  group: release
  cancel-in-progress: false

env:
  configuration: Release
  project: EasySemVer

jobs:
  build:
    # macOS, because the Swift-traited tests need a Swift toolchain and Xcode. Everything else
    # runs anywhere.
    runs-on: macos-latest

    # `id-token: write` lets nuget.org verify this workflow over OIDC (see the publish step);
    # `contents: write` is for pushing the version commit and the tag. Naming any permission
    # replaces the defaults wholesale, so both have to be stated.
    permissions:
      id-token: write
      contents: write

    # The version this run computed, for the release jobs below. They cannot read it from
    # `github.ref_name` any more, because nothing tag-shaped triggered them.
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
    # Full history and tags: EasySemVer seeds from the highest version it can find, and git tags
    # are one of the places it looks. A shallow clone hides them and would seed too low.
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    # ------------------------------------------------------------------------------------------
    # ACT-10. This step and the release step below are the block the README documents, byte for
    # byte, and ActionRegression asserts that they stay so. Between them they replaced an install
    # step, a jq-and-$GITHUB_OUTPUT step, a commit step and a tag step: about thirty lines of
    # shell, every one of which could be subtly wrong on a release and nowhere else.
    #
    # ACT-13. `uses: ./` - the manifest from this commit, not from a published tag. The binary it
    # downloads is still the published one (`version:` defaults to the pinned release), so the
    # dogfooding rule below is untouched; what changes is that the action.yml about to be released
    # is loaded by the run that releases it.
    #
    # That is not a preference. v16.0.0 shipped an action.yml carrying `${{ steps... }}` inside an
    # input *description*, which GitHub evaluates - the manifest failed to load, the release was
    # unusable by anyone, and the next run could not even start because it pinned to it. Pinning a
    # tag here means the first workflow to prove a manifest is the first one that cannot recover
    # from it being wrong.
    #
    # Dogfooding: the Action downloads a *published* binary, deliberately rather than the one this
    # run builds - if a change breaks versioning, it breaks the next release rather than silently
    # mis-versioning the one that introduced it.
    #
    # ACT-12 is why this is two steps and not one. The version has to be stamped before the build
    # so the nupkg carries it, and nothing may be committed until the tests below have passed - a
    # single step would force one of those to give. Nothing is committed yet: if the build or the
    # tests fail, the run dies and the working copy goes with the runner.
    # ------------------------------------------------------------------------------------------
    - name: Compute and apply the version
      id: version
      uses: ./

    - name: Restore dependencies
      working-directory: ./src
      run: dotnet restore

    - name: Build
      working-directory: ./src
      run: dotnet build --no-restore --configuration ${{ env.configuration }}

    - name: Unit tests
      working-directory: ./src
      run: dotnet test Test/Test.csproj --no-build --verbosity normal --configuration ${{ env.configuration }}

    # Runs the tool against this repository and against fixture trees, so it mutates the working
    # copy on purpose (TST-05). That is exactly why the release step below stages what the run
    # reported writing (REP-10) rather than `git add -u`, which would sweep this step's debris
    # into the release commit.
    - name: Integration tests
      working-directory: ./src
      run: dotnet test IntegrationTest/IntegrationTest.csproj --no-build --verbosity normal --configuration ${{ env.configuration }}

    # CI-03. Git before nuget.org, because a package cannot be unpublished. If someone pushed to
    # main while this ran, this push is rejected and the run fails having published nothing -
    # rather than leaving a version on nuget.org that no commit accounts for. The Action pushes the
    # branch and the tag atomically, so the tag cannot outlive a rejected branch push and end up
    # naming a commit the remote never received.
    #
    # A GITHUB_TOKEN push raises no events, so neither ref can trigger another run of this
    # workflow. That is also why the tag has to be consumed by the jobs below rather than trigger
    # them.
    - name: Commit and tag the release
      uses: ./
      with:
        commit: true
        tag: true
        report: ${{ steps.version.outputs.report }}

    # PKG-01: a dotnet tool package, for anyone who already has a .NET SDK.
    #
    # Trusted publishing rather than a stored API key: nuget.org trades this job's OIDC token
    # for a short-lived one. The NUGET_TOKEN secret this replaces had quietly expired, and the
    # only symptom was a 403 on the very last step of an otherwise green build - a failure mode
    # that returns every time a key ages out. There is now nothing to rotate.
    #
    # `user` is a nuget.org profile name, not a credential, and must match the owner of the
    # trusted-publishing policy registered for this repository and workflow file.
    #
    # The key is good for an hour, so it is fetched immediately before the push, not earlier.
    - name: NuGet login (OIDC → temp API key)
      uses: NuGet/login@v1
      id: login
      with:
        user: andrew-of-the-winterborn

    - name: Publish the package to nuget.org
      run: dotnet nuget push ./src/${{ env.project }}/bin/${{ env.configuration }}/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  # `gh release upload` needs a Release to exist, and a tag alone is not one. This is its own job
  # rather than a step in the matrix below, so that five parallel jobs cannot race to create the
  # same release, and it is idempotent so that re-running the workflow - which is what you do
  # when one of the five publishes fails - does not fall over on the second attempt.
  #
  # It is created as a *draft*. Publishing a release freezes it - "Cannot upload assets to an
  # immutable release", HTTP 422 - so every asset has to be attached before that happens. The
  # draft is filled by the matrix below and published by the job after it.
  create-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}

    steps:
    - name: Create the release for ${{ env.tag }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
        gh release create "${tag}" --repo "${GITHUB_REPOSITORY}"
        --draft --generate-notes --verify-tag

  # PKG-02: self-contained binaries, so a repository with no .NET in it - a Swift-only one, say -
  # can still be versioned. Runtime packs are downloadable for every target, so one Linux runner
  # cross-publishes all of them.
  release:
    needs: [ build, create-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}

    strategy:
      matrix:
        runtime: [ linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64 ]

    steps:
    # The tag, not the triggering commit. `actions/checkout` defaults to the SHA that started the
    # run, which predates the version bump - these binaries would report the previous version.
    - uses: actions/checkout@v5
      with:
        ref: ${{ env.tag }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Publish ${{ matrix.runtime }}
      run: >
        dotnet publish src/EasySemVer/EasySemVer.csproj
        --configuration ${{ env.configuration }}
        --framework net10.0
        --runtime ${{ matrix.runtime }}
        --self-contained true
        --output publish/${{ matrix.runtime }}

    - name: Archive
      run: |
        cd publish/${{ matrix.runtime }}
        if [ "${{ matrix.runtime }}" = "win-x64" ]; then
          zip -qr ../../easysemver-${{ matrix.runtime }}.zip .
        else
          tar -czf ../../easysemver-${{ matrix.runtime }}.tar.gz .
        fi

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${tag}" easysemver-${{ matrix.runtime }}.* --clobber

  # Publishing is what makes the release immutable, so it happens last, once all five archives
  # are attached. Until this runs the release is a draft and invisible to anyone but the repo's
  # own maintainers - which is the correct state for a release with no binaries on it yet.
  publish-release:
    needs: [ build, release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      tag: v${{ needs.build.outputs.version }}

    steps:
    - name: Publish the release for ${{ env.tag }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" --draft=false
