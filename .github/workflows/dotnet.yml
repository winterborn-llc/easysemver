name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]

env:
  configuration: Release
  project: EasySemVer

jobs:
  build:
    # macOS, because the Swift-traited tests need a Swift toolchain and Xcode. Everything else
    # runs anywhere.
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      working-directory: ./src
      run: dotnet restore

    - name: Build
      working-directory: ./src
      run: dotnet build --no-restore --configuration ${{ env.configuration }}

    - name: Unit tests
      working-directory: ./src
      run: dotnet test Test/Test.csproj --no-build --verbosity normal --configuration ${{ env.configuration }}

    # Runs the tool against this repository and against fixture trees, so it mutates the working
    # copy on purpose. Kept separate from the unit suite for that reason.
    - name: Integration tests
      working-directory: ./src
      run: dotnet test IntegrationTest/IntegrationTest.csproj --no-build --verbosity normal --configuration ${{ env.configuration }}

    # PKG-01: a dotnet tool package, for anyone who already has a .NET SDK.
    - name: Publish the tool to nuget.org
      if: github.ref == 'refs/heads/main'
      env:
        NUGET_AUTH_TOKEN: ${{ secrets.NUGET_TOKEN }}
      run: dotnet nuget push ./src/${{ env.project }}/bin/${{ env.configuration }}/*.nupkg -k ${{ env.NUGET_AUTH_TOKEN }} -s https://api.nuget.org/v3/index.json --skip-duplicate

  # Pushing a tag creates a tag, not a Release, and `gh release upload` needs one to exist. This
  # is its own job rather than a step in the matrix below, so that five parallel jobs cannot race
  # to create the same release, and it is idempotent so that re-running the workflow - which is
  # what you do when one of the five publishes fails - does not fall over on the second attempt.
  create-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Create the release for ${{ github.ref_name }}
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >
        gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1 ||
        gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
        --generate-notes --verify-tag

  # PKG-02: self-contained binaries, so a repository with no .NET in it - a Swift-only one, say -
  # can still be versioned. Runtime packs are downloadable for every target, so one Linux runner
  # cross-publishes all of them.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        runtime: [ linux-x64, linux-arm64, osx-x64, osx-arm64, win-x64 ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish ${{ matrix.runtime }}
      run: >
        dotnet publish src/EasySemVer/EasySemVer.csproj
        --configuration ${{ env.configuration }}
        --framework net10.0
        --runtime ${{ matrix.runtime }}
        --self-contained true
        --output publish/${{ matrix.runtime }}

    - name: Archive
      run: |
        cd publish/${{ matrix.runtime }}
        if [ "${{ matrix.runtime }}" = "win-x64" ]; then
          zip -qr ../../easysemver-${{ matrix.runtime }}.zip .
        else
          tar -czf ../../easysemver-${{ matrix.runtime }}.tar.gz .
        fi

    - name: Attach to the release
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: gh release upload "${GITHUB_REF_NAME}" easysemver-${{ matrix.runtime }}.* --clobber
